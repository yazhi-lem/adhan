name: Tests

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serving]"


      - name: Run unit tests
        run: |
          pytest -m "not integration" --cov=src/adhan_slm --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # The PyTorch trainer's MemmapShardDataset must read the shards packing.py
  # writes. The main test job doesn't install torch, so the dataset test in
  # packing_tests.py would be skipped there; this job installs CPU torch and
  # runs it for real.
  torch-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run shard format tests with torch
        run: |
          python -c "import torch; print(torch.__version__)"
          pytest src/adhan_slm/data/packing_tests.py -v -rs

  # The whole SLM pipeline must stay trainable on a plain CPU runner: corpus ->
  # frozen swaram tokenizer -> packed shards -> train, including the
  # overfit-a-batch sanity gate. `.[jax]` installs CPU wheels, so this needs no
  # GPU and no CUDA toolchain (see docs/CPU_TRAINING.md).
  cpu-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CPU JAX stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[jax,dev]"

      - name: Assert the backend is CPU
        run: python -c "import jax; assert jax.default_backend() == 'cpu', jax.devices(); print(jax.devices())"

      - name: Run E2E CPU training tests
        env:
          JAX_PLATFORMS: cpu
        run: pytest tests/integration/train_cpu_*_tests.py -v
