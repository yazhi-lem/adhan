name: Tests

on:
  push:
    branches: [main, claude/**]
  pull_request:
    # Every PR, not only the ones targeting main: the eval/model work lands as
    # stacked PRs whose base is another feature branch, and a stack member with
    # no checks is a PR nobody can review (six open PRs were in that state).

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serving]"


      - name: Run unit tests
        run: |
          pytest -m "not integration" --cov=src/adhan_slm --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # The suite must collect with the *documented* dev setup only. Optional extras (serving,
  # torch, jax) are absent here on purpose: a module that exits at import time used to kill
  # collection outright, so the main job never saw it because it installs `.[dev,serving]`.
  # adhan#121.
  collect-without-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dev extras only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert the optional extras really are absent
        run: >
          python -c "import importlib.util as u;
          missing = [n for n in ('fastapi', 'torch', 'jax') if u.find_spec(n) is None];
          assert len(missing) == 3, f'optional extra installed: {missing}';
          print('extras absent: fastapi, torch, jax')"

      - name: Collect the whole suite (must not INTERNALERROR)
        run: pytest --collect-only -q

      - name: Run the suite without optional extras
        run: pytest -q

  # The PyTorch trainer's MemmapShardDataset must read the shards packing.py
  # writes. The main test job doesn't install torch, so the dataset test in
  # packing_tests.py would be skipped there; this job installs CPU torch and
  # runs it for real.
  torch-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run shard format tests with torch
        run: |
          python -c "import torch; print(torch.__version__)"
          pytest src/adhan_slm/data/packing_tests.py -v -rs

  # The whole SLM pipeline must stay trainable on a plain CPU runner: corpus ->
  # frozen swaram tokenizer -> packed shards -> train, including the
  # overfit-a-batch sanity gate. `.[jax]` installs CPU wheels, so this needs no
  # GPU and no CUDA toolchain (see docs/training/CPU_TRAINING.md).
  cpu-training:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install CPU JAX stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[jax,dev]"

      - name: Assert the backend is CPU
        run: python -c "import jax; assert jax.default_backend() == 'cpu', jax.devices(); print(jax.devices())"

      - name: Run E2E CPU training tests
        env:
          JAX_PLATFORMS: cpu
        run: pytest tests/integration/train_cpu_*_tests.py -v
