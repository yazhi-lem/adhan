# Adhan SLM — `adhan-nano` pretraining config (Tamil, CPU, v2 akshara tokenizer)
#
# Supersedes adhan_slm_nano_cpu.yaml for the v2 corpus artifacts. Differences that
# matter, all driven by measurements rather than round numbers:
#
#   vocab_size 31,964 (not 4,000)
#     The frozen v2 tokenizer is the one that is byte-lossless and 3-4x more
#     compressed than BPE (0.349 vs ~1.39 tok/akshara). The cost: the tied
#     embedding is 256 x 31,964 = 8.2M params, 56% of the model. Measured below.
#
#   max_seq_len 512 (not 256)
#     src/adhan_slm/configs/../../docs/CPU_TRAINING.md shows 512 -> 256 buys less
#     throughput than expected while halving the context a Tamil sentence gets.
#     The shards are packed at exactly this length, so it must match.
#
# Param count (6 layers x d_model 256, d_ff 1024, tied embeddings):
#   embeddings  31,964 x 256            = 8,182,784
#   per layer   4*d^2 + 3*d*d_ff        =   1,048,576   (x6 = 6,291,456)
#   final norm  2*d                     =         512
#   total                               = 14,474,752  (~14.5M)
#
# Throughput: ~3.0k tok/s on 4 cores (measured, bfloat16, XLA:CPU). This box has
# 12 cores; expect ~6-9k tok/s. Every ETA below is stated per-thousand-tokens so
# it can be re-derived on whatever machine the run lands on.
#
# Sanity-gate the wiring first (~2-3 min, loss must collapse):
#   python -m adhan_slm.training.train_jax \
#       --config src/adhan_slm/configs/adhan_slm_nano_ta.yaml --overfit-batch --device cpu
#
# Run:
#   python -m adhan_slm.training.train_jax \
#       --config src/adhan_slm/configs/adhan_slm_nano_ta.yaml --device cpu

experiment: adhan-nano-ta
run_name: null                            # null -> MLflow autogenerates
mlflow_uri: sqlite:///mlflow.db
checkpoint_dir: checkpoints/adhan-nano-ta # Orbax dir (resumable, best-by-val)

model:
  size: nano              # 6 layers x d_model 256 — the shippable tier
  vocab_size: 31964       # must equal the shard dir's vocab.json (trainer re-derives it)
  max_seq_len: 512        # must equal the shard manifest's seq_len
  use_boundary_emb: false
  use_tinai: false        # five-landscape conditioning; see docs/TINAI_CONDITIONING.md
  dtype: bfloat16         # ~1.5x faster than float32 on XLA:CPU (measured)

train:
  batch_size: 8           # micro-batch: what one CPU step holds
  grad_accum_steps: 8     # effective batch 64 -> 32,768 tokens per optimizer update
  learning_rate: 6.0e-4   # small model + small effective batch tolerates a high LR
  warmup_steps: 200
  # 30M-token shard set / 32,768 tokens per update = 915 updates per epoch.
  # 1830 = two epochs (~60M tokens). At 6k tok/s that is ~2.8h; at 3k tok/s ~5.5h.
  max_steps: 1830
  weight_decay: 0.1
  seed: 0
  log_every: 10
  eval_every: 100
  checkpoint_every: 100
  keep_checkpoints: 3

data:
  version: adhan-corpus-v2
  # Repacked from the 293M-token archive with the v2 tokenizer at seq_len 512:
  #   python scripts/freeze_fast_tokenizer.py --corpus data/raw/expanded \
  #       --out data/final/nano_30m_s512 --reuse-tokenizer data/final/tamil_slm_v2 \
  #       --seq-len 512 --max-tokens 30000000
  shards: data/final/nano_30m_s512/
  seq_packing: true
